<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Activité — IA-TSA{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/activites.css') }}">
</head>
<body class="activity-body" data-activity="{% block slug %}{% endblock %}">

  <div class="activity-stage" id="stage">
    {% block stage %}{% endblock %}
  </div>

  <div class="activity-controls">
    <a class="activity-btn" href="{{ url_for('main.activites') }}" title="Retour au catalogue" aria-label="Retour">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
    </a>
    <button class="activity-btn activity-btn-calme" id="btn-calme" title="Mode calme (réduit tout)" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
      </svg>
    </button>
    <button class="activity-btn" id="btn-regles" title="Règles du jeu" aria-label="Règles du jeu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </button>
    <button class="activity-btn" id="btn-settings" title="Réglages" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="activity-panel" id="panel" hidden>
    <h2 class="panel-title">Réglages</h2>

    <label class="panel-row">
      <span>Son</span>
      <input type="checkbox" id="set-son">
    </label>

    <label class="panel-row">
      <span>Intensité</span>
      <input type="range" id="set-intensite" min="1" max="5" step="1">
    </label>

    <label class="panel-row">
      <span>Taille des cibles</span>
      <input type="range" id="set-taille" min="1" max="5" step="1">
    </label>

    <label class="panel-row">
      <span>Mode calme (couleurs douces, sans son)</span>
      <input type="checkbox" id="set-calme">
    </label>

    {% block panel_extra %}{% endblock %}

    <button class="panel-close" id="panel-close">Fermer</button>
  </div>

  <div class="regles-overlay" id="regles-overlay" hidden>
    <div class="regles-modal" role="dialog" aria-modal="true" aria-labelledby="regles-titre">
      <h2 class="regles-titre" id="regles-titre">{% block regles_titre %}Règles{% endblock %}</h2>
      <div class="regles-body">
        {% block regles %}
        <p>Aucune règle particulière : l'activité réagit à toute action.</p>
        {% endblock %}
      </div>
      <button class="panel-close" id="regles-close">Fermer</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/activity-core.js') }}"></script>
  {% block script %}{% endblock %}
</body>
</html>
