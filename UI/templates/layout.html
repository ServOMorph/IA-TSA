<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}IA-TSA{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">IA-TSA</span>
      </div>

      <nav class="sidebar-nav">

        <div class="nav-section">
          <button class="nav-section-toggle {% if active in ('docs_web',) %}open{% endif %}"
                  aria-expanded="{% if active in ('docs_web',) %}true{% else %}false{% endif %}"
                  onclick="toggleSection(this)">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            Recherches
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <ul class="nav-sub {% if active in ('docs_web',) %}open{% endif %}">
            <li>
              <a href="{{ url_for('main.docs_web') }}"
                 class="nav-sub-item {% if active == 'docs_web' %}active{% endif %}">
                <svg class="nav-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                Docs_web
              </a>
            </li>
          </ul>
        </div>

      </nav>
    </aside>

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>

  </div>

  <script>
    function toggleSection(btn) {
      const isOpen = btn.classList.contains("open");
      btn.classList.toggle("open", !isOpen);
      btn.setAttribute("aria-expanded", String(!isOpen));
      const sub = btn.nextElementSibling;
      sub.classList.toggle("open", !isOpen);
    }
  </script>
</body>
</html>
